###############################################################################
# acme-dns Credentials Secret
# This secret stores the acme-dns account credentials that cert-manager's
# native acmeDNS solver uses to update TXT records for DNS-01 challenge
# validation.
#
# HOW TO FILL THIS IN:
# 1. Register an account with acme-dns:
#      curl -s -X POST http://<WORKER_IP>:30080/register | jq .
#
# 2. The response will contain: username, password, fulldomain, subdomain
#
# 3. Replace the placeholder values below with the actual registration data.
#    The JSON key (e.g., "app.lab.local") should be the domain you are
#    requesting certificates for.
#
# 4. The "allowfrom" field restricts which IPs can update the TXT record.
#    Use ["0.0.0.0/0"] to allow all (lab only — restrict in production!).
#
# NOTE: The deployment script (08-deploy-acme-dns.sh) automates this
#       process and generates the secret automatically.
###############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: acme-dns
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: acme-dns
    app.kubernetes.io/part-of: acme-lab
type: Opaque
stringData:
  # JSON mapping of domain → acme-dns account credentials
  # Each domain that needs DNS-01 validation must have its own entry
  acmedns.json: |
    {
      "app.lab.local": {
        "username": "REPLACE_WITH_ACMEDNS_USERNAME",
        "password": "REPLACE_WITH_ACMEDNS_PASSWORD",
        "fulldomain": "REPLACE_WITH_ACMEDNS_FULLDOMAIN",
        "subdomain": "REPLACE_WITH_ACMEDNS_SUBDOMAIN",
        "allowfrom": ["0.0.0.0/0"]
      }
    }
