###############################################################################
# Istio Gateway + VirtualService
# Configures the Istio IngressGateway with:
#   - HTTPS on port 443 using the ACME-issued TLS certificate
#   - HTTP on port 80 with automatic redirect to HTTPS
#   - VirtualService routing traffic to the test application
###############################################################################

---
# Gateway: TLS termination at the Istio IngressGateway
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: app-gateway
  namespace: default
  labels:
    app.kubernetes.io/name: app-gateway
    app.kubernetes.io/part-of: acme-lab
spec:
  selector:
    # Use the default Istio IngressGateway
    istio: ingressgateway
  servers:
    # HTTPS server — terminates TLS using the cert-manager issued certificate
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        # This must match the secretName in the Certificate resource
        credentialName: app-tls-credential
      hosts:
        - app.lab.local
        - "*.app.lab.local"
    # HTTP server — redirects all HTTP traffic to HTTPS
    - port:
        number: 80
        name: http
        protocol: HTTP
      tls:
        httpsRedirect: true
      hosts:
        - app.lab.local
        - "*.app.lab.local"

---
# VirtualService: route traffic to the test application
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: app-virtualservice
  namespace: default
  labels:
    app.kubernetes.io/name: app-virtualservice
    app.kubernetes.io/part-of: acme-lab
spec:
  hosts:
    - app.lab.local
    - "*.app.lab.local"
  gateways:
    - app-gateway
  http:
    - route:
        - destination:
            host: my-app-service
            port:
              number: 8080
